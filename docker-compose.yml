services:
  postgres:
    image: postgres:17-alpine
    container_name: gamelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamelog
      POSTGRES_USER: gamelog
      POSTGRES_PASSWORD: gamelog
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelog -d gamelog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
